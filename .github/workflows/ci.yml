name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test --filter='./packages/*' --filter='./apps/api'
      - name: Couverture 100 % quote-engine et measurement
        run: pnpm --filter @wallscan/quote-engine --filter @wallscan/measurement test
  # Les builds mobile (EAS), desktop (tauri-action) et web (Vercel) sont ajoutés en Phase 4
  # par devops-engineer, une fois les secrets de signature disponibles.
